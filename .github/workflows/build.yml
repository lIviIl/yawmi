name: build-site
on:
  push:
    paths: ["config.json", "build.py", "src/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the site folder
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name "yawmi-bot"
          git config user.email "yawmi-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "rebuild site"
            git push
          fi
